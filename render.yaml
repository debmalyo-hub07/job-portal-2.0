# Render blueprint for the API.
#
# Committed rather than left as dashboard state: every field below is a decision
# worth reviewing, and two of them (numInstances, NODE_ENV) are security
# parameters that look like ordinary settings in a web form.
#
# Render reads this file from the repository root. The web app is not described
# here — it deploys to Vercel from frontend/, see frontend/vercel.json.
services:
  - type: web
    name: jobportal-api
    runtime: node
    plan: free
    # Keep this near the Atlas region. Every request pays the API-to-database
    # round trip, and that latency dominates anything the app itself does.
    region: singapore

    # Build from the repository root, not from backend/. npm resolves the
    # @jobportal/shared workspace symlink only from here, and shared must be
    # built before the API compiles against its emitted .d.ts — the same
    # ordering the root `ci` script encodes.
    rootDir: .
    # --include=dev is required, not stylistic. NODE_ENV=production is set below
    # as a service variable, so it is also set during the build, and npm omits
    # devDependencies whenever it sees it. That removes typescript itself along
    # with every @types/* package, so `tsc` runs without declarations and fails
    # with dozens of TS7016 "could not find a declaration file for module
    # 'express'" errors. They read like a missing dependency; nothing in them
    # points back at NODE_ENV.
    #
    # The alternative — moving @types/* into dependencies — ships compile-time
    # -only packages into the runtime image to work around an install flag.
    buildCommand: npm ci --include=dev && npm run build --workspace @jobportal/shared && npm run build --workspace @jobportal/api

    # node directly, not `npm start`. Render sends SIGTERM on every redeploy,
    # and server.ts handles it to close the listener, stop the sweeper and
    # disconnect Mongo. Through npm the signal lands on npm, which need not
    # forward it — so graceful shutdown would silently never run.
    startCommand: node backend/dist/server.js

    # /health already reports database connectivity, so a revision that boots
    # without a reachable Mongo fails the check instead of serving 500s.
    healthCheckPath: /health

    # NOT a cost decision. rateLimitStore.ts is a single-process Map
    # (docs/adr/0004-no-redis-phase-1.md), so every threshold it enforces is
    # per-instance. Two instances turn LOGIN_LOCK_THRESHOLD 5 into ~10 and
    # OTP_BUDGET_MAX_FAILURES 20 into ~40 — brute-force resistance divided by
    # the instance count. Raising this is a security change that needs the
    # shared store ADR-0004 defers. See docs/adr/0007-deploy-topology.md.
    numInstances: 1

    # Changed 2026-08-11: Render now deploys on push, as Vercel already did.
    # Previously CI was the gate and cd.yml POSTed the deploy hook after both
    # jobs passed — but the hook secret was never configured, so every deploy
    # was manual. autoDeploy: true matches the live call on Vercel; the cost is
    # that a push deploys while the suite is still running, and the revision
    # that reaches users is the one the host chose rather than the one CI
    # approved. Accepting that trade as a deliberate operating decision.
    autoDeploy: true

    envVars:
      # Pinned as a literal. env.ts defaults NODE_ENV to "development", and
      # cookies.ts keys both the Secure attribute and the __Host- prefix off it.
      # An API deployed without this boots normally, serves over Render's HTTPS,
      # reports /health ok — and sets every session cookie without Secure and
      # without __Host-. No error, no warning.
      - key: NODE_ENV
        value: production

      # The browser reaches the API same-origin, through the web app's /api
      # proxy, so the session cookies are first-party and `strict` is both
      # possible and correct. The cross-site `none` this replaced was the
      # documented failure on mobile: SameSite=None permits third-party
      # cookies, it cannot require a browser to accept them, and mobile Safari
      # blocks them while Chrome partitions them — every portal session died
      # on a tab switch or reload (ADR-0007, amendment 2026-08-30).
      #
      # This value and the CSP `connect-src` in frontend/vercel.json are one
      # decision recorded in two files. Exactly two settings are coherent:
      #
      #   cross-site   VITE_API_URL = the Render URL  -> `none`, CSP allows it
      #   same-origin  VITE_API_URL = /api/v1         -> `strict`, CSP 'self'
      #
      # Each half has been one push away from taking production down. `strict`
      # reaching a bundle that still called the API cross-site would sign
      # people in and make every following request anonymous; a narrowed CSP
      # reaching that same bundle blocked every request before it left the
      # page, which is the outage that was actually measured. This value, that
      # directive, the two Vercel variables and API_BASE_URL move together or
      # not at all — the deployment runbook's cutover section holds the order.
      - key: COOKIE_SAMESITE
        value: strict

      # Names in git, values never. `sync: false` also makes a fresh deploy stop
      # and ask rather than start with a blank value — matching how env() already
      # behaves, refusing to boot and naming every variable it is missing.
      - key: MONGO_URI
        sync: false
      # Five independent secrets. The API refuses to boot if any two are equal.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_PEPPER
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: ADMIN_PROVISIONING_SECRET
        sync: false
      # Cloudflare Turnstile server secret. Production auth fails closed without it.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Presented by the Vercel /api proxy with the real client address, which
      # `trust proxy` cannot recover on its own across two hops. Set it on both
      # hosts to the same value or every per-IP limit becomes one global bucket
      # — see backend/src/middleware/clientIp.ts.
      - key: PROXY_SHARED_SECRET
        sync: false
      # Both Google redirect URIs are derived from API_BASE_URL, and Google
      # matches redirect_uri byte-for-byte — so this must be the public Render
      # URL, with both derived URIs registered on the OAuth client.
      - key: API_BASE_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: CLIENT_URLS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
