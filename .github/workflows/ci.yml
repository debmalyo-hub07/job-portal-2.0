name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # jsdom 30 (and the undici 8 it pulls in) require Node >= 22.22 / 24.15.
      # undici reads `markAsUncloneable` from node:worker_threads unguarded, so
      # on Node 20 every jsdom import dies with "not a function". Node 20 is
      # also EOL as of April 2026.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # shared must build first: the API typechecks against its emitted .d.ts
      - run: npm run build --workspace @jobportal/shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    # Production dependencies only, with an explicit allowlist for advisories
    # that have no published fix. See scripts/audit-prod.mjs for why each
    # suppression exists. Anything unlisted fails the build.
    #
    # This job is NOT continue-on-error: a suppressed advisory should be a
    # deliberate, documented decision, not a permanently red check that trains
    # everyone to ignore CI.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
