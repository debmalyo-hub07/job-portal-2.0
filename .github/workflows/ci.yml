name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # shared must build first: the API typechecks against its emitted .d.ts
      - run: npm run build --workspace @jobportal/shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    # Informational. A transitive advisory with no available fix should not
    # block an unrelated pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
