name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # jsdom 30 (and the undici 8 it pulls in) require Node >= 22.22 / 24.15.
      # undici reads `markAsUncloneable` from node:worker_threads unguarded, so
      # on Node 20 every jsdom import dies with "not a function". Node 20 is
      # also EOL as of April 2026.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # shared must build first: the API typechecks against its emitted .d.ts
      - run: npm run build --workspace @jobportal/shared
      - run: npm run typecheck
      - run: npm run lint
      # The colour-token gate. It was advisory through 2A/2B (exit 1 with a
      # known-violation count that drifted 18 -> 23 unnoticed, because nothing
      # ran it). It is now zero, and zero is enforced here: a non-token colour
      # fails the build rather than being counted.
      - run: npm run lint:colour --workspace @jobportal/web
      - run: npm run test
      # VITE_API_URL is required at build time, not merely at runtime. The value
      # is inlined as a literal, so with it unset Rolldown proves apiClient's
      # import-time throw always fires and tree-shakes the whole application
      # away — a 275 kB bundle against a real 874 kB, holding no route and no
      # page, emitted with exit 0. vite.config.js now refuses that build; this
      # is the value that satisfies it. It is a placeholder, never the real API
      # origin: nothing here runs the bundle, and the deployed value comes from
      # the host's own environment.
      - run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000/api/v1
          # Cloudflare's documented public always-pass test key. The matching
          # secret is never needed because CI does not submit a challenge.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

  audit:
    runs-on: ubuntu-latest
    # Production dependencies only. The explicit allowlist is empty; every high
    # or critical advisory fails unless a reviewer documents an unreachable
    # code path and a concrete re-check condition in scripts/audit-prod.mjs.
    #
    # This job is NOT continue-on-error: a suppressed advisory should be a
    # deliberate, documented decision, not a permanently red check that trains
    # everyone to ignore CI.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:prod

  # Deployment is gated on both jobs above. `needs` is the whole mechanism: it
  # is what makes a green suite the precondition for a deploy rather than a
  # coincidence that happens to finish first.
  #
  # Pull requests build and test but never deploy. `secrets: inherit` is
  # required — a reusable workflow sees none of the caller's secrets otherwise,
  # and both deploy steps skip quietly by design, so the omission would look
  # exactly like success.
  deploy:
    needs: [verify, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
